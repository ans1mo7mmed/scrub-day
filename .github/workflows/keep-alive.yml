# يمنع Supabase من إيقاف الداتابيس بسبب عدم النشاط (يرسل طلب قراءة كل يومين)
name: keep-supabase-alive
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" -X POST \
            "https://giskxbbjhcqlmdgjgyml.supabase.co/rest/v1/rpc/list_students" \
            -H "apikey: sb_publishable_t_Lh384XOBiuWXMWj91Olw_r-DOzzVc" \
            -H "Content-Type: application/json" -d '{}'
